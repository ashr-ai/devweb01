<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let scores = [12, 8, 17, 5, 20]
        let compteur = 0
// Combien de scores sont >= 10, afficher le résultat
        for (let i = 0; i < scores.length; i++) {
            if (scores[i] >= 10) {
                compteur++  
            }
        }
        console.log("Résultat : " + compteur)
    </script>
</body>
</html>
