<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refuge, Fiche animal (exercice)</title>
  <style>
    :root {
      --color-bg: #f5f6fa;
      --color-card: #ffffff;
      --color-primary: #1d3557;
      --color-accent: #457b9d;
      --color-danger: #e63946;
      --color-success: #2a9d8f;
      --color-text: #2b2d42;
      --color-border: #dcdde1;
      --radius: 8px;
      --spacing: 1rem;
    }

    .badge {
      padding: 3px;
      border-radius: 20px;
      color: var(--color-text);
      background-color: var(--color-bg)
    }

    .badge-disponible {
      background-color: var(--color-success);
    }

    .badge-adopte {
      background-color: var(--color-danger);
    }

    .page-wrapper {
      background-color: var(--color-bg);
      border-radius: 25px;
      border: 2px solid var(--color-accent);
      display: flex;
      flex-direction: column;
      padding: 20px;
      width: 400px;
    }

    .page-wrapper>div {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <span id="nom-animal">Chargement...</span>
    <span id="badge-adoption" class="badge">...</span>
  </header>

  <main>
    <p>Type : <span id="type-animal">...</span></p>
    <p>Couleur : <span id="couleur-animal">...</span></p>
  </main>

  <script>
    // Donnée de départ, ne pas modifier
    const animalVedette = {
      nom: "Milo",
      type: "Chien",
      couleur: "Brun",
      disponibleAdoption: true // true ou false
    };

    let animaux = [
      { nom: "Milo", type: "Chien", couleur: "Brun", disponibleAdoption: true },
      { nom: "Luna", type: "Chat", couleur: "Noir", disponibleAdoption: false },
      { nom: "Charlie", type: "Chien", couleur: "Blanc", disponibleAdoption: true },
      { nom: "Bella", type: "Lapin", couleur: "Gris", disponibleAdoption: true },
      { nom: "Simba", type: "Chat", couleur: "Orange", disponibleAdoption: false },
      { nom: "Coco", type: "Perroquet", couleur: "Vert", disponibleAdoption: true },
      { nom: "Rex", type: "Chien", couleur: "Noir et blanc", disponibleAdoption: false },
      { nom: "Pixel", type: "Chat", couleur: "Gris et blanc", disponibleAdoption: true }
    ];

    // Les querySelector
    let nom = document.querySelector("#nom-animal")
    let type = document.querySelector("#type-animal")
    let couleur = document.querySelector("#couleur-animal")
    let adoption = document.querySelector("#badge-adoption")

    // Création de wrapper (div qui encadre le tout)
    const header = document.querySelector("header");
    const main = document.querySelector("main");

    const wrapper = document.createElement("div");
    wrapper.className = "page-wrapper";

    header.parentNode.insertBefore(wrapper, header);

    wrapper.appendChild(header);
    wrapper.appendChild(main);

    // Remplissage de l'animal vedette
    nom.textContent = `Nom de l'animal : ${animalVedette.nom}`
    type.textContent = animalVedette.type
    couleur.textContent = animalVedette.couleur

    if (animalVedette.disponibleAdoption == true) {
      adoption.textContent = "Disponible pour adoption"
      adoption.classList.add("badge-disponible")
    } else {
      adoption.textContent = "Déjà adopté"
      adoption.classList.add("badge-adopte")
    }

    function creerCarteAnimal(animal) {
      const section = document.createElement("section");
      section.className = "page-wrapper";

      const entete = document.createElement("div");

      const nom = document.createElement("span");
      nom.textContent = `Nom de l'animal : ${animal.nom}`;

      const type = document.createElement("p");
      type.textContent = `Type : ${animal.type}`;

      const couleur = document.createElement("p");
      couleur.textContent = `Couleur : ${animal.couleur}`;

      const badge = document.createElement("span");
      badge.classList.add("badge");

      if (animal.disponibleAdoption) {
        badge.textContent = "Disponible pour adoption";
        badge.classList.add("badge-disponible");
      } else {
        badge.textContent = "Déjà adopté";
        badge.classList.add("badge-adopte");
      }

      entete.appendChild(nom);
      entete.appendChild(badge);

      section.appendChild(entete);
      section.appendChild(type);
      section.appendChild(couleur);

      return section;
    }


    const listeAnimaux = document.createElement("div");
    document.body.appendChild(listeAnimaux);

    listeAnimaux.appendChild(wrapper);

    for (const animal of animaux.slice(1)) {
      listeAnimaux.appendChild(creerCarteAnimal(animal));
    }



  </script>

</body>

</html>
