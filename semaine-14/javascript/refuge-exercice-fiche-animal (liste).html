<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refuge, Fiche animal (exercice)</title>
  <style>
    :root {
      --color-bg: #f5f6fa;
      --color-card: #ffffff;
      --color-primary: #1d3557;
      --color-accent: #457b9d;
      --color-danger: #e63946;
      --color-success: #2a9d8f;
      --color-text: #2b2d42;
      --color-border: #dcdde1;
      --radius: 8px;
      --spacing: 1rem;
    }

    .badge {
      padding: 3px;
      border-radius: 20px;
      color: var(--color-text);
      background-color: var(--color-bg)
    }

    .badge-disponible {
      background-color: var(--color-success);
    }

    .badge-adopte {
      background-color: var(--color-danger);
    }

    /* .page-wrapper {
      background-color: var(--color-bg);
      border-radius: 25px;
      border: 2px solid var(--color-accent);
      display: flex;
      flex-direction: column;
      height: 300px;
      padding: 20px;
      width: 400px;
    } */

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <span id="nom-animal">Chargement...</span>
    <span id="badge-adoption" class="badge">...</span>
  </header>

  <main>
    <p>Type : <span id="type-animal">...</span></p>
    <p>Couleur : <span id="couleur-animal">...</span></p>
  </main>

  <script>
    // Donnée de départ, ne pas modifier
    const animalVedette = {
      nom: "Milo",
      type: "Chien",
      couleur: "Brun",
      disponibleAdoption: true // true ou false
    };

    let animaux = [
      { nom: "Milo", type: "Chien", couleur: "Brun", disponibleAdoption: true },
      { nom: "Luna", type: "Chat", couleur: "Noir", disponibleAdoption: false },
      { nom: "Charlie", type: "Chien", couleur: "Blanc", disponibleAdoption: true },
      { nom: "Bella", type: "Lapin", couleur: "Gris", disponibleAdoption: true },
      { nom: "Simba", type: "Chat", couleur: "Orange", disponibleAdoption: false },
      { nom: "Coco", type: "Perroquet", couleur: "Vert", disponibleAdoption: true },
      { nom: "Rex", type: "Chien", couleur: "Noir et blanc", disponibleAdoption: false },
      { nom: "Pixel", type: "Chat", couleur: "Gris et blanc", disponibleAdoption: true }
    ];

    // TODO 1 : sélectionne les 4 éléments qu'on doit remplir
    //          (#nom-animal, #type-animal, #couleur-animal, #badge-adoption)
    let nom = document.querySelector("#nom-animal")
    let type = document.querySelector("#type-animal")
    let couleur = document.querySelector("#couleur-animal")
    let adoption = document.querySelector("#badge-adoption")

    const header = document.querySelector("header");
    const main = document.querySelector("main");

    const wrapper = document.createElement("div");
    wrapper.className = "page-wrapper";

    header.parentNode.insertBefore(wrapper, header);

    wrapper.appendChild(header);
    wrapper.appendChild(main);

    // TODO 2 : injecte le nom, le type et la couleur avec textContent
    nom.textContent = `Nom de l'animal : ${animalVedette.nom}`
    type.textContent = animalVedette.type
    couleur.textContent = animalVedette.couleur

    // TODO 3 : selon la valeur de disponibleAdoption, mets à jour le texte du badge
    //  ("Disponible pour adoption" ou "Déjà adopté") et ajoute la bonne classe
    //  CSS (badge-disponible ou badge-adopte) à l'élément du badge.
    //  Indice : if (animalVedette.disponibleAdoption) { ... } else { ... }
    if (animalVedette.disponibleAdoption == true) {
      adoption.textContent = "Disponible pour adoption"
      adoption.classList.add("badge-disponible")
    } else {
      adoption.textContent = "Déjà adopté"
      adoption.classList.add("badge-adopte")
    }

    const liste = document.createElement("ul");

    for (let i = 0; i < animaux.length; i++) {
      const animal = animaux[i];
      const item = document.createElement("li");

      item.textContent = `${animal.nom} | ${animal.type} | ${animal.couleur} | `;

      const badge = document.createElement("span");
      badge.classList.add("badge");

      if (animal.disponibleAdoption) {
        badge.textContent = "Disponible pour adoption";
        badge.classList.add("badge-disponible");
      } else {
        badge.textContent = "Déjà adopté";
        badge.classList.add("badge-adopte");
      }
      item.appendChild(badge);
      liste.appendChild(item);
    }

    wrapper.appendChild(liste);

  </script>

</body>

</html>
