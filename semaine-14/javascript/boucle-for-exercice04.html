<body>
  <script>
    let mots = ["Bonjour", "tout", "le", "monde"];
    let phrase = "";

    // Construire une phrase avec les mots
    // afficher la phrase finale

    for (let i = 0; i < mots.length; i++) {
      phrase = phrase + mots[i]
      if (i < 3) {
        phrase = phrase + " ";
      } else {
        phrase = phrase + ".";
      }  
    }
    console.log(phrase)

  </script>
</body>
